<!DOCTYPE html>
<html lang="es" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${competicion.id == null} ? 'Registrar competición | Champions Fútbol' : 'Editar competición | Champions Fútbol'">Registrar competición | Champions Fútbol</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/estilos.css}" rel="stylesheet">
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg fixed-top">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">
            <div class="logo">
                <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="50" cy="50" r="38" stroke="white" stroke-width="3"/>
                    <path d="M50 25L61 33L57 46H43L39 33L50 25Z" fill="white" fill-opacity=".9"/>
                    <path d="M39 33L27 38L31 51L43 46" stroke="#6EB4FF" stroke-width="3"/>
                    <path d="M61 33L73 38L69 51L57 46" stroke="#6EB4FF" stroke-width="3"/>
                    <path d="M31 51L38 65L50 70L62 65L69 51" stroke="white" stroke-width="3"/>
                </svg>
            </div>
            Champions Fútbol
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navMenu" aria-controls="navMenu" aria-expanded="false" aria-label="Abrir menú">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navMenu">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/}">Inicio</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/club/listar}">Clubes</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/jugador/listar}">Jugadores</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/entrenador/listar}">Entrenadores</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/asociacion/listar}">Asociaciones</a></li>
                <li class="nav-item"><a class="nav-link active" th:href="@{/competicion/listar}">Competiciones</a></li>
            </ul>
        </div>
    </div>
</nav>

<!-- CONTENIDO -->
<main class="pagina">
    <div class="container">

        <div class="pagina-header">
            <div>
                <div class="pagina-label">Competiciones</div>
                <h1 class="pagina-titulo" th:text="${competicion.id == null} ? 'Registrar competición' : 'Editar competición'">Registrar competición</h1>
            </div>
            <a class="btn-hero btn-hero-secondary" th:href="@{/competicion/listar}">← Volver al listado</a>
        </div>

        <div class="panel">
            <form th:action="@{/competicion/guardar}" th:object="${competicion}" method="post" novalidate>

                <input type="hidden" th:field="*{id}">

                <div class="row g-4">

                    <div class="col-md-8">
                        <label class="form-label" for="nombre">Nombre de la competición</label>
                        <input type="text" class="form-control" id="nombre" th:field="*{nombre}"
                               placeholder="Ej: Copa Libertadores">
                        <div class="text-error" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label" for="montoPremio">Monto del premio</label>
                        <input type="number" class="form-control" id="montoPremio" th:field="*{montoPremio}"
                               min="0" placeholder="Ej: 20000000">
                        <div class="text-error" th:if="${#fields.hasErrors('montoPremio')}" th:errors="*{montoPremio}"></div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label" for="fechaInicio">Fecha de inicio</label>
                        <input type="date" class="form-control" id="fechaInicio" th:field="*{fechaInicio}">
                        <div class="text-error" th:if="${#fields.hasErrors('fechaInicio')}" th:errors="*{fechaInicio}"></div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label" for="fechaFin">Fecha de fin</label>
                        <input type="date" class="form-control" id="fechaFin" th:field="*{fechaFin}">
                        <div class="text-error" th:if="${#fields.hasErrors('fechaFin')}" th:errors="*{fechaFin}"></div>
                    </div>

                </div>

                <div class="d-flex flex-wrap gap-2 mt-4">
                    <button type="submit" class="btn-hero btn-hero-primary"
                            th:text="${competicion.id == null} ? 'Guardar competición' : 'Guardar cambios'">Guardar competición</button>
                    <a class="btn-hero btn-hero-secondary" th:href="@{/competicion/listar}">Cancelar</a>
                </div>

            </form>
        </div>

    </div>
</main>

<footer>
    <div class="container text-center">
        © 2026 Champions Fútbol · Proyecto académico
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
